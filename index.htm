<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smiling Cat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="cat-container">
        <div class="cat">
            <div class="ear left-ear"></div>
            <div class="ear right-ear"></div>

            <div class="face">
                <div class="eye left-eye"></div>
                <div class="eye right-eye"></div>

                <div class="nose"></div>

                <div class="mouth">
                    <span class="mouth-left"></span>
                    <span class="mouth-right"></span>
                </div>

                <div class="whiskers left-whiskers">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

                <div class="whiskers right-whiskers">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <p>😺 Hello!</p>
    </div>

</body>
</html>
